# C:\Users\druiv\Desktop\Jet_Files\Jet_Windows_Workspace\models.embedders.ini

# Launch command examples:
# llama-server --models-preset models.embedders.ini --models-max 1 --host 0.0.0.0 --port 8081

version = 1

[*]  # Global defaults - tuned for Ryzen 5 3600 + GTX 1660 6GB
; c = 2048              # Reduced from 8192 to save VRAM (adjust if you need longer contexts)
; ngl = 35
; threads = 6
; threads-batch = 6
; cache-type-k = q8_0
; cache-type-v = q8_0
; flash-attn = on
; mlock = true
; no-mmap = true
; cont-batching = true
; parallel = 2          # NEW: Limit concurrent request processing
tags = embed

# ====================== Embeddings / RAG ======================
[nomic-embed-1.5]
# nomic-ai/nomic-embed-text-v1.5
# Native: Dynamic NTK-Aware RoPE (unavailable in llama.cpp)
# Workaround: YaRN with freq-scale 0.75 for context > 2048 [[1]][[4]]
# Base context: 2048 tokens; extended max: 8192 tokens
model = C:\Users\druiv\.cache\llama.cpp\embed_models\nomic-embed-text-v1.5.Q4_K_M.gguf
c = 2048
ngl = 999
alias = nomic-embed:1.5
embedding = true
pooling = mean
batch-size = 2048
ubatch-size = 2048          # MUST equal batch-size for embeddings [[3]][[26]]
# RoPE scaling OMITTED: not needed when c <= 2048 (base context) [[15]]
# Add these ONLY if increasing c beyond 2048:
# rope-scaling = yarn
# rope-freq-scale = 0.75
jinja = false
parallel = 2
load-on-startup = true

[nomic-embed-2-moe]
# nomic-ai/nomic-embed-text-v2-moe
# Max context: 512 tokens (HARD LIMIT, no extension) [[18]][[21]]
# NO RoPE scaling - model was not trained with context extension [[18]]
model = C:\Users\druiv\.cache\llama.cpp\embed_models\nomic-embed-text-v2-moe.Q4_K_M.gguf
c = 512
ngl = 999
alias = nomic-embed:2-moe
embedding = true
pooling = mean
batch-size = 512
ubatch-size = 512           # MUST equal batch-size for embeddings [[3]][[26]]
# NO rope-scaling or rope-freq-scale for this model [[18]]
jinja = false
parallel = 1
load-on-startup = false

[all-minilm-l12]
# sentence-transformers/all-MiniLM-L12-v2
model = C:\Users\druiv\.cache\llama.cpp\embed_models\all-MiniLM-L12-v2-q4_0.gguf
c = 2048
ngl = 999
alias = all-minilm:l12-q4
embedding = true
pooling = mean
batch-size = 512
ubatch-size = 256
jinja = false
parallel = 2

[embedding-gemma-300m]
# google/embeddinggemma-300m
model = C:\Users\druiv\.cache\llama.cpp\embed_models\embeddinggemma-300M-Q8_0.gguf
c = 2048
ngl = 999
alias = embedding-gemma:300m
embedding = true
pooling = mean
batch-size = 2048
ubatch-size = 512
jinja = false
parallel = 2

[qwen3-embed-4b]
# Qwen/Qwen3-Embedding-4B
model = C:\Users\druiv\.cache\llama.cpp\embed_models\Qwen3-Embedding-4B-Q5_0.gguf
c = 2048
ngl = 999
alias = qwen3-embed:4b-q5_0
embedding = true
pooling = last
batch-size = 128          # Significantly reduced for 4B model
ubatch-size = 128         # Significantly reduced for 4B model
jinja = false
parallel = 1              # Large model, only 1 concurrent request

