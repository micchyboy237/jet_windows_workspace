# ====================== Embeddings / RAG ======================
[nomic-embed-1.5]
# nomic-ai/nomic-embed-text-v1.5
model = C:\Users\druiv\.cache\llama.cpp\embed_models\nomic-embed-text-v1.5.Q4_K_M.gguf
c = 8192                # UPDATED: was 2048, matched to PS1 -c 8192
ngl = 999               # Kept at 999 (functionally same as PS1 -ngl 99)
alias = nomic-embed:1.5
embedding = true
pooling = mean
batch-size = 8192       # UPDATED: was 2048, matched to PS1 -b 8192
ubatch-size = 8192      # UPDATED: was 1024, matched to PS1 -ub 8192
rope-scaling = yarn     # ADDED: matched to PS1 --rope-scaling yarn
rope-freq-scale = 0.75  # ADDED: matched to PS1 --rope-freq-scale 0.75
jinja = false
parallel = 4            # UPDATED: was 2, matched to PS1 -np 4
; load-on-startup = true

[nomic-embed-2-moe]
# nomic-ai/nomic-embed-text-v2-moe
model = C:\Users\druiv\.cache\llama.cpp\embed_models\nomic-embed-text-v2-moe.Q4_K_M.gguf
c = 2048
ngl = 999
alias = nomic-embed:2-moe
