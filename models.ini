# C:\Users\druiv\Desktop\Jet_Files\Jet_Windows_Workspace\models.ini
# Launch command examples:
# llama-server --models-preset models.ini --models-max 3 --host 0.0.0.0 --port 8080
version = 1
[*]  # Global defaults - tuned for Ryzen 5 3600 + GTX 1660 6GB
; c = 4096
; ngl = 35
; threads = 6
; threads-batch = 6
; cache-type-k = q8_0
; cache-type-v = q8_0
; flash-attn = on
mlock = true
mmap = true
; no-mmap = true
; cont-batching = true
; parallel = 1

# ====================== Uncensored Models ======================
[qwen3.5-2b-uncensored]
# HauhauCS/Qwen3.5-2B-Uncensored-HauhauCS-Aggressive
model = C:\Users\druiv\.cache\llama.cpp\nsfw\Qwen3.5-2B-Uncensored-HauhauCS-Aggressive-Q4_K_M.gguf
mmproj = C:\Users\druiv\.cache\llama.cpp\nsfw\mmproj-Qwen3.5-2B-Uncensored-HauhauCS-Aggressive-f16.gguf
chat-template-file = C:\Users\druiv\.cache\llama.cpp\jinja-templates\Qwen3.5_2B_adjusted.jinja
c = 32768                 ; was 16384 (KV cache is only ~0.3 GB at this size)
ngl = 99
alias = qwen3.5-uncensored:2b
cache-type-k = q8_0
cache-type-v = q8_0
flash-attn = on           ; NEW: required for the q8_0 V cache
image-max-tokens = 1024
threads = 4               ; was 6 (GPU does the work)
fit = off
warmup = true
cache-prompt = true
; load-on-startup = true

[qwen3.5-4b-uncensored]
