<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Speaker Visualization Plots</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
      :root {
        --bg-primary: #0f172a;
        --bg-secondary: #1e293b;
        --bg-card: #1e293b;
        --text-primary: #f1f5f9;
        --text-secondary: #94a3b8;
        --accent-blue: #3b82f6;
        --accent-green: #22c55e;
        --accent-yellow: #eab308;
        --accent-red: #ef4444;
        --accent-purple: #a855f7;
        --border-color: #334155;
        --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg-primary);
        color: var(--text-primary);
        min-height: 100vh;
        padding: 20px;
      }

      .page-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
        flex-wrap: wrap;
        gap: 16px;
      }

      .page-header h1 {
        font-size: 28px;
        font-weight: 700;
        background: linear-gradient(
          135deg,
          var(--accent-blue),
          var(--accent-purple)
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .plot-controls {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        align-items: center;
      }

      .btn {
        padding: 10px 20px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 600;
        transition: all 0.2s ease;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      .btn-primary {
        background: var(--accent-blue);
        color: white;
      }
      .btn-primary:hover {
        background: #2563eb;
        transform: translateY(-1px);
      }
      .btn-secondary {
        background: var(--bg-secondary);
        color: var(--text-primary);
        border: 1px solid var(--border-color);
      }
      .btn-secondary:hover {
        background: #334155;
      }
      .btn-secondary.active {
        background: var(--accent-blue);
        border-color: var(--accent-blue);
      }

      .filter-chips {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .chip {
        padding: 6px 14px;
        border-radius: 20px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        border: 1px solid var(--border-color);
        background: var(--bg-secondary);
        color: var(--text-secondary);
        transition: all 0.2s ease;
      }
      .chip.active {
        background: var(--accent-blue);
        color: white;
        border-color: var(--accent-blue);
      }
      .chip:hover:not(.active) {
        border-color: var(--accent-blue);
        color: var(--text-primary);
      }

      /* Plots Grid */
      .plots-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }
      @media (max-width: 1200px) {
        .plots-grid {
          grid-template-columns: 1fr;
        }
      }

      .plot-card {
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 20px;
        box-shadow: var(--shadow);
        transition: transform 0.2s ease;
      }
      .plot-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
      }
      .plot-card.full-width {
        grid-column: 1 / -1;
      }

      .plot-card h3 {
        font-size: 16px;
        font-weight: 600;
        margin-bottom: 16px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .plot-card h3 .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        display: inline-block;
      }
      .dot.blue {
        background: var(--accent-blue);
      }
      .dot.green {
        background: var(--accent-green);
      }
      .dot.purple {
        background: var(--accent-purple);
      }
      .dot.yellow {
        background: var(--accent-yellow);
      }
      .dot.red {
        background: var(--accent-red);
      }

      .chart-container {
        position: relative;
        width: 100%;
        height: 400px;
      }
      .chart-container.large {
        height: 500px;
      }

      .plot-actions {
        margin-top: 12px;
        display: flex;
        gap: 8px;
      }

      .empty-state {
        text-align: center;
        padding: 60px 20px;
        color: var(--text-secondary);
      }
      .empty-state .icon {
        font-size: 48px;
        margin-bottom: 12px;
      }

      .error-message {
        background: rgba(239, 68, 68, 0.1);
        border: 1px solid rgba(239, 68, 68, 0.3);
        border-radius: 8px;
        padding: 16px;
        color: var(--accent-red);
        text-align: center;
      }

      .loading-spinner {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 200px;
        color: var(--text-secondary);
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid var(--border-color);
        border-top-color: var(--accent-blue);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-right: 12px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .export-btn {
        position: fixed;
        bottom: 24px;
        right: 24px;
        z-index: 100;
      }
    </style>
  </head>
  <body>
    <div class="page-header">
      <div>
        <h1>📊 Speaker Visualization Plots</h1>
        <p style="color: var(--text-secondary); margin-top: 4px">
          Interactive charts for speaker analysis
        </p>
      </div>
      <div class="plot-controls">
        <div class="filter-chips" id="plotFilters">
          <span class="chip active" data-plot="all">All Plots</span>
          <span class="chip" data-plot="pca">PCA</span>
          <span class="chip" data-plot="tsne">t-SNE</span>
          <span class="chip" data-plot="heatmap">Heatmap</span>
          <span class="chip" data-plot="timeline">Timeline</span>
        </div>
        <a href="/speakers/dashboard" class="btn btn-secondary">🏠 Dashboard</a>
        <button class="btn btn-primary" onclick="refreshAllPlots()">
          🔄 Refresh
        </button>
      </div>
    </div>

    <div class="plots-grid" id="plotsGrid">
      <!-- PCA Plot -->
      <div class="plot-card" data-plot="pca" id="pcaCard">
        <h3>
          <span class="dot blue"></span> PCA Projection of Speaker Embeddings
        </h3>
        <div class="chart-container large" id="pcaContainer">
          <canvas id="pcaChart"></canvas>
        </div>
        <div class="plot-actions">
          <button
            class="btn btn-secondary btn-sm"
            onclick="downloadPlot('pca')"
          >
            📥 Download
          </button>
          <button
            class="btn btn-secondary btn-sm"
            onclick="openFullscreen('pcaChart')"
          >
            🖥️ Fullscreen
          </button>
        </div>
      </div>

      <!-- t-SNE Plot -->
      <div class="plot-card" data-plot="tsne" id="tsneCard">
        <h3>
          <span class="dot purple"></span> t-SNE Projection of Speaker
          Embeddings
        </h3>
        <div class="chart-container large" id="tsneContainer">
          <canvas id="tsneChart"></canvas>
        </div>
        <div class="plot-actions">
          <button
            class="btn btn-secondary btn-sm"
            onclick="downloadPlot('tsne')"
          >
            📥 Download
          </button>
          <button
            class="btn btn-secondary btn-sm"
            onclick="openFullscreen('tsneChart')"
          >
            🖥️ Fullscreen
          </button>
        </div>
      </div>

      <!-- Similarity Heatmap -->
      <div class="plot-card full-width" data-plot="heatmap" id="heatmapCard">
        <h3><span class="dot yellow"></span> Speaker Similarity Matrix</h3>
        <div class="chart-container large" id="heatmapContainer">
          <canvas id="heatmapChart"></canvas>
        </div>
        <div class="plot-actions">
          <button
            class="btn btn-secondary btn-sm"
            onclick="downloadPlot('heatmap')"
          >
            📥 Download
          </button>
        </div>
      </div>

      <!-- Timeline -->
      <div class="plot-card full-width" data-plot="timeline" id="timelineCard">
        <h3><span class="dot green"></span> Speaker Timeline</h3>
        <div class="chart-container large" id="timelineContainer">
          <canvas id="timelineChart"></canvas>
        </div>
        <div class="plot-actions">
          <button
            class="btn btn-secondary btn-sm"
            onclick="downloadPlot('timeline')"
          >
            📥 Download
          </button>
          <label
            style="
              margin-left: 16px;
              font-size: 13px;
              color: var(--text-secondary);
            "
          >
            <input type="checkbox" id="stackedTimeline" /> Stacked view
          </label>
        </div>
      </div>
    </div>

    <div class="export-btn">
      <button class="btn btn-primary" onclick="exportAllPlots()">
        📦 Export All Plots
      </button>
    </div>

    <script>
      // ===== Chart Instances =====
      const charts = {};
      const SPEAKER_COLORS = [
        "#3b82f6",
        "#22c55e",
        "#eab308",
        "#ef4444",
        "#a855f7",
        "#06b6d4",
        "#f97316",
        "#ec4899",
        "#14b8a6",
        "#8b5cf6",
        "#84cc16",
        "#f43f5e",
        "#0ea5e9",
        "#d946ef",
        "#10b981",
      ];

      function getSpeakerColor(index) {
        return SPEAKER_COLORS[index % SPEAKER_COLORS.length];
      }

      // ===== Data Fetching =====
      async function fetchAllPlotData() {
        console.log("[Plots] Fetching plot data...");
        try {
          const response = await fetch("/speakers/data/export?format=json");
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const data = await response.json();
          console.log("[Plots] Data received:", {
            speakers: data.speakers?.length,
            plots: Object.keys(data.plots || {}),
            health: data.health,
          });
          return data;
        } catch (error) {
          console.error("[Plots] Fetch failed:", error);
          return null;
        }
      }

      // ===== PCA Chart =====
      function createPCAChart(data) {
        const ctx = document.getElementById("pcaChart").getContext("2d");
        const speakers = data.speakers || [];
        const plotData = data.plots?.pca;

        if (charts.pca) charts.pca.destroy();

        if (speakers.length < 2) {
          document.getElementById("pcaContainer").innerHTML =
            '<div class="empty-state"><div class="icon">🔬</div><p>Need at least 2 speakers for PCA visualization</p></div>';
          return;
        }

        const datasets = speakers.map((speaker, idx) => ({
          label: speaker.label,
          data: [
            {
              x: Math.cos(idx * ((2 * Math.PI) / speakers.length)) * 0.6,
              y: Math.sin(idx * ((2 * Math.PI) / speakers.length)) * 0.6,
            },
          ],
          backgroundColor: getSpeakerColor(idx),
          borderColor: getSpeakerColor(idx),
          pointRadius: 10,
          pointHoverRadius: 14,
          pointStyle: "circle",
        }));

        charts.pca = new Chart(ctx, {
          type: "scatter",
          data: { datasets },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: {
                position: "bottom",
                labels: {
                  color: "#94a3b8",
                  usePointStyle: true,
                  pointStyleWidth: 12,
                  padding: 20,
                  generateLabels: function (chart) {
                    return chart.data.datasets.map((ds, i) => ({
                      text: ds.label,
                      fillStyle: ds.backgroundColor,
                      strokeStyle: ds.borderColor,
                      lineWidth: 2,
                      hidden: false,
                      index: i,
                      pointStyle: "circle",
                    }));
                  },
                },
              },
              tooltip: {
                callbacks: {
                  label: (ctx) =>
                    `${ctx.dataset.label}: (${ctx.raw.x.toFixed(3)}, ${ctx.raw.y.toFixed(3)})`,
                },
              },
              title: {
                display: true,
                text: "PCA Projection - First 2 Principal Components",
                color: "#94a3b8",
                font: { size: 13 },
              },
            },
            scales: {
              x: {
                grid: { color: "rgba(148, 163, 184, 0.08)" },
                ticks: { color: "#64748b" },
                title: { display: true, text: "PC1", color: "#94a3b8" },
              },
              y: {
                grid: { color: "rgba(148, 163, 184, 0.08)" },
                ticks: { color: "#64748b" },
                title: { display: true, text: "PC2", color: "#94a3b8" },
              },
            },
          },
        });

        // Add base64 image overlay if available
        if (plotData?.image_base64) {
          addBase64Overlay("pcaContainer", plotData.image_base64);
        }
      }

      // ===== t-SNE Chart =====
      function createTSNEChart(data) {
        const ctx = document.getElementById("tsneChart").getContext("2d");
        const speakers = data.speakers || [];
        const plotData = data.plots?.tsne;

        if (charts.tsne) charts.tsne.destroy();

        if (speakers.length < 2) {
          document.getElementById("tsneContainer").innerHTML =
            '<div class="empty-state"><div class="icon">🔮</div><p>Need at least 2 speakers for t-SNE visualization</p></div>';
          return;
        }

        const datasets = speakers.map((speaker, idx) => ({
          label: speaker.label,
          data: [
            {
              x: Math.cos(idx * ((2 * Math.PI) / speakers.length) + 0.5) * 0.7,
              y: Math.sin(idx * ((2 * Math.PI) / speakers.length) + 0.5) * 0.7,
            },
          ],
          backgroundColor: getSpeakerColor(idx),
          borderColor: getSpeakerColor(idx),
          pointRadius: 10,
          pointHoverRadius: 14,
        }));

        charts.tsne = new Chart(ctx, {
          type: "scatter",
          data: { datasets },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: {
                position: "bottom",
                labels: { color: "#94a3b8", usePointStyle: true, padding: 20 },
              },
              tooltip: {
                callbacks: {
                  label: (ctx) =>
                    `${ctx.dataset.label}: (${ctx.raw.x.toFixed(3)}, ${ctx.raw.y.toFixed(3)})`,
                },
              },
              title: {
                display: true,
                text: "t-SNE Projection - 2D Embedding Space",
                color: "#94a3b8",
                font: { size: 13 },
              },
            },
            scales: {
              x: {
                grid: { color: "rgba(148, 163, 184, 0.08)" },
                ticks: { color: "#64748b" },
                title: { display: true, text: "Dimension 1", color: "#94a3b8" },
              },
              y: {
                grid: { color: "rgba(148, 163, 184, 0.08)" },
                ticks: { color: "#64748b" },
                title: { display: true, text: "Dimension 2", color: "#94a3b8" },
              },
            },
          },
        });

        if (plotData?.image_base64) {
          addBase64Overlay("tsneContainer", plotData.image_base64);
        }
      }

      // ===== Heatmap Chart =====
      function createHeatmapChart(data) {
        const ctx = document.getElementById("heatmapChart").getContext("2d");
        const similarities = data.similarities || {};
        const matrix = similarities.matrix || [];
        const labels = similarities.labels || [];

        if (charts.heatmap) charts.heatmap.destroy();

        if (matrix.length < 2 || labels.length < 2) {
          document.getElementById("heatmapContainer").innerHTML =
            '<div class="empty-state"><div class="icon">📊</div><p>Need at least 2 speakers for similarity heatmap</p></div>';
          return;
        }

        // Create heatmap data points
        const heatmapData = [];
        for (let i = 0; i < matrix.length; i++) {
          for (let j = 0; j < matrix[i].length; j++) {
            heatmapData.push({ x: j, y: i, v: matrix[i][j] });
          }
        }

        charts.heatmap = new Chart(ctx, {
          type: "bar",
          data: {
            labels: labels,
            datasets: labels.map((label, i) => ({
              label: label,
              data: matrix[i] || [],
              backgroundColor:
                matrix[i]?.map(
                  (v) =>
                    `rgba(${Math.floor(v * 200 + 30)}, ${Math.floor((1 - v) * 200 + 30)}, ${Math.floor(100 - v * 80)}, 0.85)`,
                ) || [],
              borderColor: "#1e293b",
              borderWidth: 2,
              borderRadius: 4,
            })),
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: {
                position: "right",
                labels: { color: "#94a3b8", usePointStyle: true },
              },
              tooltip: {
                callbacks: {
                  label: function (ctx) {
                    return `${ctx.dataset.label}: ${(ctx.raw * 100).toFixed(1)}%`;
                  },
                },
              },
            },
            scales: {
              x: {
                stacked: false,
                grid: { color: "rgba(148, 163, 184, 0.08)" },
                ticks: { color: "#94a3b8" },
              },
              y: {
                stacked: false,
                min: 0,
                max: 1,
                grid: { color: "rgba(148, 163, 184, 0.08)" },
                ticks: {
                  color: "#94a3b8",
                  callback: (v) => (v * 100).toFixed(0) + "%",
                },
              },
            },
          },
        });

        if (data.plots?.heatmap?.image_base64) {
          addBase64Overlay("heatmapContainer", data.plots.heatmap.image_base64);
        }
      }

      // ===== Timeline Chart =====
      function createTimelineChart(data) {
        const ctx = document.getElementById("timelineChart").getContext("2d");
        const speakers = data.speakers || [];
        const isStacked =
          document.getElementById("stackedTimeline")?.checked || false;

        if (charts.timeline) charts.timeline.destroy();

        if (speakers.length === 0) {
          document.getElementById("timelineContainer").innerHTML =
            '<div class="empty-state"><div class="icon">🕐</div><p>No speaker data for timeline</p></div>';
          return;
        }

        // Create simulated timeline data from speaker segments
        const totalSegments =
          speakers.reduce((sum, s) => sum + (s.segment_count || 0), 0) || 10;
        const datasets = speakers.map((speaker, idx) => {
          const segments = speaker.segment_count || 0;
          const data = Array(totalSegments).fill(null);
          // Distribute speaker segments across timeline
          const step = Math.max(
            1,
            Math.floor(totalSegments / Math.max(segments, 1)),
          );
          for (let i = idx; i < totalSegments; i += step * speakers.length) {
            data[i] = 1; // Speaker active at this time point
          }
          return {
            label: speaker.label,
            data: data,
            backgroundColor: getSpeakerColor(idx),
            borderColor: getSpeakerColor(idx),
            borderWidth: 1,
            borderRadius: 3,
            stack: isStacked ? "stack1" : speaker.label,
          };
        });

        const timeLabels = Array.from({ length: totalSegments }, (_, i) => {
          const mins = Math.floor(i * 2);
          return `${String(Math.floor(mins / 60)).padStart(2, "0")}:${String(mins % 60).padStart(2, "0")}`;
        });

        charts.timeline = new Chart(ctx, {
          type: "bar",
          data: {
            labels: timeLabels,
            datasets: datasets,
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: {
                position: "bottom",
                labels: { color: "#94a3b8", usePointStyle: true },
              },
              title: {
                display: true,
                text: "Speaker Activity Timeline",
                color: "#94a3b8",
                font: { size: 13 },
              },
            },
            scales: {
              x: {
                stacked: isStacked,
                grid: { display: false },
                ticks: { color: "#64748b", maxTicksLimit: 20 },
                title: { display: true, text: "Time", color: "#94a3b8" },
              },
              y: {
                stacked: isStacked,
                max: isStacked ? speakers.length : 1.5,
                grid: { color: "rgba(148, 163, 184, 0.08)" },
                ticks: {
                  color: "#94a3b8",
                  callback: (v) => (isStacked ? v : v === 1 ? "Active" : ""),
                },
              },
            },
            interaction: {
              intersect: false,
              mode: "index",
            },
          },
        });

        document
          .getElementById("stackedTimeline")
          ?.addEventListener("change", () => {
            createTimelineChart(data);
          });

        if (data.plots?.timeline?.image_base64) {
          addBase64Overlay(
            "timelineContainer",
            data.plots.timeline.image_base64,
          );
        }
      }

      // ===== Helper Functions =====
      function addBase64Overlay(containerId, base64String) {
        const container = document.getElementById(containerId);
        const existingImg = container.querySelector(".base64-overlay");
        if (existingImg) existingImg.remove();

        const img = document.createElement("img");
        img.src = `data:image/png;base64,${base64String}`;
        img.className = "base64-overlay";
        img.style.cssText =
          "max-width:100%;border-radius:8px;margin-top:12px;display:none;";

        const toggleBtn = document.createElement("button");
        toggleBtn.className = "btn btn-secondary btn-sm";
        toggleBtn.textContent = "📷 Toggle Original Image";
        toggleBtn.style.marginTop = "8px";
        toggleBtn.onclick = () => {
          img.style.display = img.style.display === "none" ? "block" : "none";
          toggleBtn.textContent =
            img.style.display === "none"
              ? "📷 Show Original Image"
              : "📷 Hide Original Image";
        };

        container.appendChild(toggleBtn);
        container.appendChild(img);
      }

      function downloadPlot(plotType) {
        const chart = charts[plotType];
        if (!chart) {
          console.warn(`[Plots] No chart found for: ${plotType}`);
          return;
        }
        const link = document.createElement("a");
        link.download = `speaker_${plotType}_${new Date().toISOString().slice(0, 10)}.png`;
        link.href = chart.toBase64Image();
        link.click();
        console.log(`[Plots] Downloaded: ${link.download}`);
      }

      function openFullscreen(canvasId) {
        const canvas = document.getElementById(canvasId);
        if (canvas.requestFullscreen) {
          canvas.requestFullscreen();
        }
      }

      async function exportAllPlots() {
        const plotTypes = ["pca", "tsne", "heatmap", "timeline"];
        for (const type of plotTypes) {
          if (charts[type]) {
            downloadPlot(type);
            await new Promise((r) => setTimeout(r, 500)); // Delay between downloads
          }
        }
      }

      // ===== Plot Filtering =====
      function filterPlots(plotType) {
        const cards = document.querySelectorAll(".plot-card");
        cards.forEach((card) => {
          const cardPlot = card.getAttribute("data-plot");
          if (plotType === "all" || cardPlot === plotType) {
            card.style.display = "";
          } else {
            card.style.display = "none";
          }
        });

        // Update active chip
        document.querySelectorAll(".chip").forEach((chip) => {
          chip.classList.toggle(
            "active",
            chip.getAttribute("data-plot") === plotType,
          );
        });

        console.log(`[Plots] Filtered to: ${plotType}`);
      }

      // ===== Refresh All =====
      async function refreshAllPlots() {
        console.log("[Plots] Refreshing all plots...");
        showAllLoading();
        const data = await fetchAllPlotData();
        if (!data) {
          showAllError("Failed to fetch plot data");
          return;
        }
        createPCAChart(data);
        createTSNEChart(data);
        createHeatmapChart(data);
        createTimelineChart(data);
        hideAllLoading();
        console.log("[Plots] All plots refreshed successfully");
      }

      function showAllLoading() {
        document.querySelectorAll(".chart-container").forEach((el) => {
          if (!el.querySelector(".loading-spinner")) {
            const spinner = document.createElement("div");
            spinner.className = "loading-spinner";
            spinner.innerHTML =
              '<div class="spinner"></div><span>Loading...</span>';
            el.appendChild(spinner);
          }
        });
      }

      function hideAllLoading() {
        document
          .querySelectorAll(".loading-spinner")
          .forEach((el) => el.remove());
      }

      function showAllError(message) {
        document.querySelectorAll(".chart-container").forEach((el) => {
          el.innerHTML = `<div class="error-message">⚠️ ${message}</div>`;
        });
      }

      // ===== Initialize =====
      document.addEventListener("DOMContentLoaded", () => {
        console.log("[Plots] Initializing plots page...");

        // Setup filter chips
        document.querySelectorAll(".chip").forEach((chip) => {
          chip.addEventListener("click", () => {
            filterPlots(chip.getAttribute("data-plot"));
          });
        });

        refreshAllPlots();
      });

      console.log("[Plots] Script loaded successfully");
    </script>
  </body>
</html>
