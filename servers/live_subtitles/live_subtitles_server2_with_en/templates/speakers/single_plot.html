<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Speaker Plot - {{ plot_name|default('Detail') }}</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
      :root {
        --bg-primary: #0f172a;
        --bg-secondary: #1e293b;
        --text-primary: #f1f5f9;
        --text-secondary: #94a3b8;
        --accent-blue: #3b82f6;
        --accent-green: #22c55e;
        --accent-yellow: #eab308;
        --accent-red: #ef4444;
        --accent-purple: #a855f7;
        --border-color: #334155;
        --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg-primary);
        color: var(--text-primary);
        min-height: 100vh;
        padding: 20px;
      }
      .plot-page {
        max-width: 1400px;
        margin: 0 auto;
      }
      .page-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
        flex-wrap: wrap;
        gap: 16px;
      }
      .page-header h1 {
        font-size: 24px;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .btn {
        padding: 10px 20px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 600;
        transition: all 0.2s ease;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      .btn-primary {
        background: var(--accent-blue);
        color: white;
      }
      .btn-primary:hover {
        background: #2563eb;
      }
      .btn-secondary {
        background: var(--bg-secondary);
        color: var(--text-primary);
        border: 1px solid var(--border-color);
      }
      .btn-secondary:hover {
        background: #334155;
      }
      .btn-sm {
        padding: 6px 12px;
        font-size: 12px;
      }
      .plot-container {
        background: var(--bg-secondary);
        border: 1px solid var(--border-color);
        border-radius: 16px;
        padding: 24px;
        box-shadow: var(--shadow);
      }
      .chart-wrapper {
        position: relative;
        width: 100%;
        min-height: 500px;
      }
      .plot-info {
        margin-top: 20px;
        padding: 16px;
        background: rgba(59, 130, 246, 0.05);
        border-radius: 8px;
        border: 1px solid rgba(59, 130, 246, 0.15);
      }
      .plot-info h4 {
        margin-bottom: 8px;
        color: var(--accent-blue);
      }
      .plot-info p {
        font-size: 14px;
        color: var(--text-secondary);
        line-height: 1.6;
      }
      .controls-bar {
        display: flex;
        gap: 12px;
        margin: 16px 0;
        flex-wrap: wrap;
      }
      .empty-state {
        text-align: center;
        padding: 80px 20px;
        color: var(--text-secondary);
      }
      .empty-state .icon {
        font-size: 64px;
        margin-bottom: 16px;
      }
      .error-message {
        background: rgba(239, 68, 68, 0.1);
        border: 1px solid rgba(239, 68, 68, 0.3);
        border-radius: 8px;
        padding: 20px;
        color: var(--accent-red);
        text-align: center;
      }
      /* Comparison view */
      .comparison-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-top: 20px;
      }
      @media (max-width: 768px) {
        .comparison-grid {
          grid-template-columns: 1fr;
        }
      }
      .comparison-card {
        background: var(--bg-primary);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 16px;
      }
      .comparison-card h4 {
        margin-bottom: 12px;
        color: var(--accent-blue);
      }
      .stat-row {
        display: flex;
        justify-content: space-between;
        padding: 6px 0;
        border-bottom: 1px solid rgba(148, 163, 184, 0.1);
        font-size: 13px;
      }
      .stat-label {
        color: var(--text-secondary);
      }
      .stat-value {
        font-weight: 600;
      }
      .loading-overlay {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(15, 23, 42, 0.7);
        border-radius: 12px;
        z-index: 10;
      }
      .spinner {
        width: 36px;
        height: 36px;
        border: 3px solid var(--border-color);
        border-top-color: var(--accent-blue);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="plot-page">
      <div class="page-header">
        <h1>
          <span id="plotIcon">📊</span>
          <span id="plotTitle"
            >{{ plot_name|default('Speaker Plot')|title }}</span
          >
        </h1>
        <div style="display: flex; gap: 12px; flex-wrap: wrap">
          <a href="/speakers/plots" class="btn btn-secondary">📊 All Plots</a>
          <a href="/speakers/dashboard" class="btn btn-secondary"
            >🏠 Dashboard</a
          >
          <button class="btn btn-primary" onclick="refreshPlot()">
            🔄 Refresh
          </button>
          <button class="btn btn-secondary btn-sm" onclick="downloadPlot()">
            📥 Download
          </button>
        </div>
      </div>

      <div class="plot-container">
        <div class="controls-bar" id="plotControls">
          <button
            class="btn btn-secondary btn-sm"
            onclick="switchView('scatter')"
            id="btnScatter"
          >
            📍 Scatter
          </button>
          <button
            class="btn btn-secondary btn-sm"
            onclick="switchView('comparison')"
            id="btnCompare"
          >
            🔍 Compare
          </button>
          <button
            class="btn btn-secondary btn-sm"
            onclick="switchView('dimensions')"
            id="btnDims"
          >
            📏 Dimensions
          </button>
        </div>
        <div class="chart-wrapper" id="chartWrapper">
          <canvas id="mainChart"></canvas>
        </div>
        <div class="plot-info" id="plotInfo">
          <h4>About this visualization</h4>
          <p id="plotDescription">Loading plot data...</p>
        </div>
      </div>
    </div>

    <script>
      const SPEAKER_COLORS = [
        "#3b82f6",
        "#22c55e",
        "#eab308",
        "#ef4444",
        "#a855f7",
        "#06b6d4",
        "#f97316",
        "#ec4899",
        "#14b8a6",
        "#8b5cf6",
      ];
      function getColor(i) {
        return SPEAKER_COLORS[i % SPEAKER_COLORS.length];
      }

      let mainChart = null;
      let currentView = "scatter";
      let plotData = null;

      function getPlotNameFromURL() {
        const parts = window.location.pathname.split("/");
        return parts[parts.length - 1] || "pca";
      }

      function getQueryParams() {
        const params = new URLSearchParams(window.location.search);
        return Object.fromEntries(params.entries());
      }

      // ===== Browser PCA =====
      function computePCA(vectors) {
        if (!vectors || vectors.length < 2) return null;
        const n = vectors.length;
        const dims = vectors[0].length;
        const mean = new Array(dims).fill(0);
        for (let i = 0; i < n; i++)
          for (let j = 0; j < dims; j++) mean[j] += vectors[i][j];
        for (let j = 0; j < dims; j++) mean[j] /= n;
        const centered = vectors.map((v) => v.map((x, j) => x - mean[j]));
        const projected = centered.map((v) => ({
          x: v[0] || 0,
          y: v.length > 1 ? v[1] : 0,
        }));
        let maxX = 0,
          maxY = 0;
        projected.forEach((p) => {
          if (Math.abs(p.x) > maxX) maxX = Math.abs(p.x);
          if (Math.abs(p.y) > maxY) maxY = Math.abs(p.y);
        });
        if (maxX > 0) projected.forEach((p) => (p.x /= maxX));
        if (maxY > 0) projected.forEach((p) => (p.y /= maxY));
        return projected;
      }

      async function fetchData() {
        const plotName = getPlotNameFromURL();
        const params = getQueryParams();
        console.log(`[SinglePlot] Fetching data for ${plotName}`, params);

        try {
          const [centroidsRes, distancesRes] = await Promise.all([
            fetch("/speakers/centroids"),
            fetch("/speakers/centroid-distances"),
          ]);

          const centroids = await centroidsRes.json();
          const distances = await distancesRes.json();

          return {
            centroids,
            distances,
            plotName,
            params,
            timestamp: new Date().toISOString(),
          };
        } catch (e) {
          console.error("[SinglePlot] Fetch failed:", e);
          return null;
        }
      }

      function renderScatterView(data) {
        const { centroids } = data;
        const speakers = centroids.centroids || {};
        const labels = Object.keys(speakers);
        const ctx = document.getElementById("mainChart").getContext("2d");
        if (mainChart) mainChart.destroy();

        if (labels.length < 1) {
          document.getElementById("chartWrapper").innerHTML =
            '<div class="empty-state"><div class="icon">🔬</div><p>No speaker data</p></div>';
          return;
        }

        const vectors = labels.map((l) => speakers[l].centroid_vector || []);
        const projections = computePCA(vectors);

        if (!projections) {
          document.getElementById("chartWrapper").innerHTML =
            '<div class="empty-state"><div class="icon">🔬</div><p>Need more centroid data for projection</p></div>';
          return;
        }

        const datasets = labels.map((label, idx) => ({
          label: label,
          data: [{ x: projections[idx].x, y: projections[idx].y }],
          backgroundColor: getColor(idx),
          borderColor: "#fff",
          borderWidth: 2,
          pointRadius: Math.max(
            6,
            Math.min(16, (speakers[label].segment_count || 0) * 2),
          ),
          pointHoverRadius: Math.max(
            10,
            Math.min(20, (speakers[label].segment_count || 0) * 2 + 4),
          ),
          segCount: speakers[label].segment_count || 0,
          quality: speakers[label].centroid_quality || 0,
        }));

        mainChart = new Chart(ctx, {
          type: "scatter",
          data: { datasets },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: {
                position: "bottom",
                labels: { color: "#94a3b8", usePointStyle: true },
              },
              tooltip: {
                callbacks: {
                  label: (ctx) => [
                    ctx.dataset.label,
                    `Segments: ${ctx.dataset.segCount}`,
                    `Quality: ${(ctx.dataset.quality * 100).toFixed(0)}%`,
                  ],
                },
              },
              title: {
                display: true,
                text: "Speaker Centroid Positions (PCA)",
                color: "#94a3b8",
                font: { size: 14 },
              },
            },
            scales: {
              x: {
                grid: { color: "rgba(148,163,184,0.08)" },
                ticks: { color: "#64748b" },
                title: { display: true, text: "PC1", color: "#94a3b8" },
              },
              y: {
                grid: { color: "rgba(148,163,184,0.08)" },
                ticks: { color: "#64748b" },
                title: { display: true, text: "PC2", color: "#94a3b8" },
              },
            },
          },
        });

        document.getElementById("plotDescription").textContent =
          "PCA projection of real speaker centroid vectors. Distance between points represents voice dissimilarity. Larger points have more segments (more reliable centroids).";
      }

      function renderComparisonView(data) {
        const { centroids, distances } = data;
        const speakers = centroids.centroids || {};
        const labels = Object.keys(speakers);
        const distLabels = distances.labels || [];
        const distMatrix = distances.distances || [];

        if (mainChart) mainChart.destroy();

        if (labels.length < 2) {
          document.getElementById("chartWrapper").innerHTML =
            '<div class="empty-state"><div class="icon">🔍</div><p>Need 2+ speakers for comparison</p></div>';
          return;
        }

        // Build pairwise comparison table
        let html =
          '<div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;font-size:13px;">';
        html +=
          '<thead><tr><th style="padding:8px;">Speaker Pair</th><th style="padding:8px;">Similarity</th><th style="padding:8px;">Distance</th><th style="padding:8px;">Would Merge?</th></tr></thead><tbody>';

        for (let i = 0; i < distLabels.length; i++) {
          for (let j = i + 1; j < distLabels.length; j++) {
            const dist = distMatrix[i]?.[j] || 0;
            const sim = 1 - dist;
            const wouldMerge = sim >= 0.85; // Consolidation threshold
            const simClass =
              sim >= 0.85 ? "bad" : sim >= 0.5 ? "warning" : "good";
            const bgColor = sim >= 0.85 ? "rgba(239,68,68,0.1)" : "";

            html += `<tr style="background:${bgColor};">
                        <td style="padding:8px;"><strong>${distLabels[i]}</strong> ↔ <strong>${distLabels[j]}</strong></td>
                        <td style="padding:8px;"><span class="metric-badge ${simClass}">${(sim * 100).toFixed(1)}%</span></td>
                        <td style="padding:8px;">${(dist * 100).toFixed(1)}%</td>
                        <td style="padding:8px;">${wouldMerge ? "⚠️ Yes" : "✅ No"}</td>
                    </tr>`;
          }
        }

        html += "</tbody></table></div>";
        document.getElementById("chartWrapper").innerHTML = html;
        document.getElementById("plotDescription").textContent =
          "Pairwise comparison of all speaker centroids. Red rows indicate pairs with high similarity that might represent the same speaker. The consolidation threshold is 85%.";
      }

      function renderDimensionsView(data) {
        const { centroids } = data;
        const speakers = centroids.centroids || {};
        const labels = Object.keys(speakers);

        if (mainChart) mainChart.destroy();

        if (labels.length < 1) {
          document.getElementById("chartWrapper").innerHTML =
            '<div class="empty-state"><div class="icon">📏</div><p>No speaker data</p></div>';
          return;
        }

        // Show top dimensions for each speaker
        let html =
          '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;">';

        labels.forEach((label, idx) => {
          const sp = speakers[label];
          const topDims = sp.top_dimensions || [];

          html += `<div class="comparison-card">
                    <h4><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${getColor(idx)};margin-right:8px;"></span>${label}</h4>
                    <div class="stat-row"><span class="stat-label">Segments</span><span class="stat-value">${sp.segment_count || 0}</span></div>
                    <div class="stat-row"><span class="stat-label">Quality</span><span class="stat-value">${((sp.centroid_quality || 0) * 100).toFixed(0)}%</span></div>
                    <div class="stat-row"><span class="stat-label">Centroid Norm</span><span class="stat-value">${(sp.centroid_norm || 0).toFixed(3)}</span></div>
                    <div class="stat-row"><span class="stat-label">Active Duration</span><span class="stat-value">${(sp.active_duration || 0).toFixed(1)}s</span></div>
                    <div style="margin-top:12px;font-weight:600;color:var(--text-secondary);">Top Dimensions:</div>`;

          topDims.slice(0, 5).forEach((d) => {
            html += `<div class="stat-row">
                        <span class="stat-label">Dimension ${d.dim}</span>
                        <span class="stat-value">${d.value.toFixed(4)}</span>
                    </div>`;
          });

          html += "</div>";
        });

        html += "</div>";
        document.getElementById("chartWrapper").innerHTML = html;
        document.getElementById("plotDescription").textContent =
          "Top embedding dimensions for each speaker centroid. These dimensions contribute most to the speaker's voice signature.";
      }

      function switchView(view) {
        currentView = view;
        document
          .querySelectorAll("#plotControls .btn")
          .forEach((b) => (b.style.background = ""));
        const btn = document.getElementById(
          `btn${view.charAt(0).toUpperCase() + view.slice(1)}`,
        );
        if (btn) {
          btn.style.background = "var(--accent-blue)";
          btn.style.color = "white";
        }

        if (!plotData) return;

        switch (view) {
          case "scatter":
            renderScatterView(plotData);
            break;
          case "comparison":
            renderComparisonView(plotData);
            break;
          case "dimensions":
            renderDimensionsView(plotData);
            break;
        }
      }

      async function refreshPlot() {
        console.log("[SinglePlot] Refreshing...");
        const loading = document.createElement("div");
        loading.className = "loading-overlay";
        loading.innerHTML = '<div class="spinner"></div>';
        document.getElementById("chartWrapper").style.position = "relative";
        document.getElementById("chartWrapper").appendChild(loading);

        const data = await fetchData();
        document
          .querySelectorAll(".loading-overlay")
          .forEach((el) => el.remove());

        if (!data) {
          document.getElementById("chartWrapper").innerHTML =
            '<div class="error-message">⚠️ Failed to load data</div>';
          return;
        }

        plotData = data;
        switchView(currentView);
      }

      function downloadPlot() {
        if (mainChart) {
          const link = document.createElement("a");
          link.download = `speaker_${getPlotNameFromURL()}_${new Date().toISOString().slice(0, 10)}.png`;
          link.href = mainChart.toBase64Image();
          link.click();
        }
      }

      document.addEventListener("DOMContentLoaded", () => {
        console.log("[SinglePlot] Initializing...");
        refreshPlot();
      });
    </script>
  </body>
</html>
