<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes"
    />
    <title>Speaker diarization · variance & separation</title>
    <style>
      :root {
        --color-bg: #ffffff;
        --color-surface-primary: #ffffff;
        --color-surface-secondary: #f5f6f8;
        --color-text-primary: #0f1825;
        --color-text-secondary: #5a6270;
        --color-text-tertiary: #8b919d;
        --color-border-tertiary: #e3e6ec;
        --border-radius-md: 10px;
        --border-radius-lg: 16px;
        --font-sans:
          system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue",
          sans-serif;
        --shadow-sm: 0 2px 6px rgba(0, 0, 0, 0.02);
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: var(--color-bg);
        font-family: var(--font-sans);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 1.5rem;
        color: var(--color-text-primary);
      }
      .dashboard {
        max-width: 720px;
        width: 100%;
        background: var(--color-bg);
        padding: 1.25rem 0.5rem;
      }
      .section-label {
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--color-text-tertiary);
        margin: 0 0 10px;
      }
      .metric-card {
        background: var(--color-surface-secondary);
        border-radius: var(--border-radius-md);
        padding: 12px 16px;
      }
      .metric-val {
        font-size: 22px;
        font-weight: 500;
        color: var(--color-text-primary);
        margin: 2px 0 0;
        line-height: 1.2;
      }
      .metric-lbl {
        font-size: 12px;
        color: var(--color-text-secondary);
      }
      .speaker-card {
        background: var(--color-surface-primary);
        border: 0.5px solid var(--color-border-tertiary);
        border-radius: var(--border-radius-lg);
        padding: 1rem 1.25rem;
        margin-bottom: 10px;
        box-shadow: var(--shadow-sm);
      }
      .badge {
        display: inline-block;
        font-size: 11px;
        font-weight: 500;
        padding: 3px 9px;
        border-radius: 99px;
        line-height: 1.4;
      }
      .badge-healthy {
        background: #eaf3de;
        color: #3b6d11;
      }
      .badge-warning {
        background: #faeeda;
        color: #854f0b;
      }
      .badge-unhealthy {
        background: #fcebeb;
        color: #a32d2d;
      }

      /* core / outlier pills */
      .seg-core-pill {
        display: inline-flex;
        align-items: center;
        gap: 3px;
        font-size: 10px;
        font-weight: 500;
        padding: 2px 6px;
        border-radius: 99px;
        line-height: 1.4;
        white-space: nowrap;
        flex-shrink: 0;
      }
      .seg-core-pill.core {
        background: #e1f5ee;
        color: #085041;
      }
      .seg-core-pill.outlier {
        background: #faeeda;
        color: #854f0b;
      }
      .seg-core-pill .dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
      }
      .seg-core-pill.core .dot {
        background: #0f6e56;
      }
      .seg-core-pill.outlier .dot {
        background: #ef9f27;
      }

      .dist-bar-bg {
        background: var(--color-surface-secondary);
        border-radius: 4px;
        height: 6px;
        overflow: hidden;
        width: 100%;
      }
      .dist-bar-fill {
        height: 100%;
        border-radius: 4px;
        width: 0%;
      }
      .seg-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 6px;
      }
      .seg-id {
        font-size: 12px;
        color: #3b82f6;
        min-width: 100px;
        cursor: pointer;
        text-decoration: underline;
        text-underline-offset: 2px;
        transition: color 0.15s;
      }
      .seg-id:hover {
        color: #1d4ed8;
      }
      .seg-duration {
        font-size: 11px;
        color: var(--color-text-tertiary);
        min-width: 48px;
        text-align: right;
      }
      .seg-val {
        font-size: 12px;
        color: var(--color-text-primary);
        min-width: 36px;
        text-align: right;
        font-weight: 500;
      }
      .pair-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 6px 0;
        border-bottom: 0.5px solid var(--color-border-tertiary);
        font-size: 13px;
      }
      .pair-row:last-child {
        border-bottom: none;
      }
      .grid-4 {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
        margin-bottom: 1.5rem;
      }
      .grid-2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .speaker-header {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 10px;
      }
      .avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        font-weight: 500;
      }
      .speaker-name {
        font-size: 14px;
        font-weight: 500;
        color: var(--color-text-primary);
      }
      .speaker-meta {
        font-size: 11px;
        color: var(--color-text-secondary);
      }

      /* centroid purity bar */
      .purity-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
        font-size: 12px;
        color: var(--color-text-secondary);
      }
      .purity-bar-bg {
        flex: 1;
        background: var(--color-surface-secondary);
        border-radius: 4px;
        height: 6px;
        overflow: hidden;
      }
      .purity-bar-fill {
        height: 100%;
        border-radius: 4px;
        background: #1d9e75;
      }
      .purity-label {
        min-width: 80px;
      }
      .purity-count {
        min-width: 64px;
        text-align: right;
        color: var(--color-text-tertiary);
        font-size: 11px;
      }

      /* segment list legend */
      .seg-legend {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 6px;
        font-size: 11px;
        color: var(--color-text-tertiary);
      }

      .flex-between {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 1.5rem;
      }
      button {
        background: var(--color-surface-secondary);
        border: 0.5px solid var(--color-border-tertiary);
        border-radius: 40px;
        padding: 0.4rem 1rem;
        font-size: 12px;
        font-weight: 500;
        color: var(--color-text-primary);
        cursor: pointer;
        background: white;
        transition: 0.2s;
      }
      button:hover {
        background: #f0f2f5;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        border: 0;
      }
      @media (max-width: 500px) {
        .grid-4 {
          grid-template-columns: repeat(2, 1fr);
        }
        .grid-2 {
          grid-template-columns: 1fr;
        }
        body {
          padding: 0.8rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="dashboard" id="dashboard-root"></div>
    <script>
      (function () {
        const API_BASE = "/speakers/metrics";
        const DATA_URL = `${API_BASE}/data`;
        const SEGMENT_BASE = "/speakers/segment";

        console.log("[SpeakerMetrics] Initialized");

        async function fetchMetricsData(speakerLabel = null) {
          const url = speakerLabel
            ? `${DATA_URL}?label=${encodeURIComponent(speakerLabel)}`
            : DATA_URL;
          try {
            const r = await fetch(url);
            if (!r.ok) throw new Error(`HTTP ${r.status}: ${r.statusText}`);
            const data = await r.json();
            console.log("[SpeakerMetrics] Data fetched:", data);
            return data;
          } catch (e) {
            console.error("[SpeakerMetrics] Fetch error:", e);
            return null;
          }
        }

        function openSegmentDetail(segmentId) {
          if (!segmentId || segmentId === "unknown") return;
          window.open(
            `${SEGMENT_BASE}/${encodeURIComponent(segmentId)}`,
            "_blank",
          );
        }

        // ── transform ──────────────────────────────────────────────────
        function transformSpeakerData(apiData) {
          if (!apiData)
            return {
              speakers: [],
              pairs: [],
              stats: null,
              overallHealth: "unhealthy",
            };
          const intra = apiData.intra_speaker || {};
          const inter = apiData.inter_speaker || {};
          const colorPalette = [
            { color: "#3C3489", bg: "#EEEDFE" },
            { color: "#085041", bg: "#E1F5EE" },
            { color: "#712B13", bg: "#FAECE7" },
            { color: "#1B4F72", bg: "#E8F4FD" },
            { color: "#7B241C", bg: "#FDEDEC" },
          ];
          const speakers = (intra.speakers || []).map((spk, idx) => {
            const palette = colorPalette[idx % colorPalette.length];
            const segs = (spk.segments || []).map((seg) => ({
              id: seg.id || "unknown",
              d: seg.d || 0,
              duration: seg.duration || 0,
              isCore: seg.is_core !== undefined ? seg.is_core : true, // ← pass through
            }));
            const coreCount = segs.filter((s) => s.isCore).length;
            return {
              id: spk.label.replace("SPEAKER_", "S"),
              label: spk.label,
              segmentsCount: spk.segmentsCount || 0,
              health: spk.health || "healthy",
              color: palette.color,
              bg: palette.bg,
              meanDist: spk.meanDist || 0,
              stdDev: spk.stdDev || 0,
              minDist: spk.minDist || 0,
              maxDist: spk.maxDist || 0,
              coreCount,
              segments: segs,
            };
          });
          const pairs = (inter.pairwise || []).map((p) => ({
            from: p.from,
            to: p.to,
            distance: p.distance || 0,
          }));
          const stats = {
            mean: inter.meanSeparation || 0,
            stdDev: inter.stdSeparation || 0,
            min: inter.minSeparation || 0,
            max: inter.maxSeparation || 0,
          };
          return {
            speakers,
            pairs,
            stats,
            overallHealth: inter.health || "unhealthy",
          };
        }

        // ── helpers ────────────────────────────────────────────────────
        function barColor(d) {
          if (d <= 0.3) return "#1D9E75";
          if (d <= 0.5) return "#EF9F27";
          return "#E24B4A";
        }

        function formatDuration(s) {
          if (!s || s <= 0) return "—";
          if (s < 1.0) return (s * 1000).toFixed(0) + "ms";
          if (s < 60) return s.toFixed(1) + "s";
          return `${Math.floor(s / 60)}m ${(s % 60).toFixed(0)}s`;
        }

        function badgeClass(health) {
          return health === "healthy"
            ? "badge-healthy"
            : health === "warning"
              ? "badge-warning"
              : "badge-unhealthy";
        }

        // ── separation card ────────────────────────────────────────────
        function renderSeparationCard(pairs, stats, health) {
          const mean = stats.mean.toFixed(2);
          const maxD = Math.max(...pairs.map((p) => p.distance), 1.0);
          return `
            <div class="speaker-card" style="margin-bottom: 1.5rem;">
              <div style="display:flex; align-items:center; gap:10px; margin-bottom:1rem;">
                <span class="badge ${badgeClass(health)}">${health}</span>
                <span style="font-size:13px; color:var(--color-text-secondary);">
                  Mean separation: <strong style="color:var(--color-text-primary);">${mean}</strong>
                </span>
                <span style="font-size:13px; color:var(--color-text-secondary); margin-left:auto;">${pairs.length} pairs</span>
              </div>
              <div class="grid-4" style="margin-bottom:1rem;">
                <div class="metric-card"><div class="metric-lbl">Mean</div><div class="metric-val">${mean}</div></div>
                <div class="metric-card"><div class="metric-lbl">Std dev</div><div class="metric-val">${stats.stdDev.toFixed(2)}</div></div>
                <div class="metric-card"><div class="metric-lbl">Min</div><div class="metric-val">${stats.min.toFixed(2)}</div></div>
                <div class="metric-card"><div class="metric-lbl">Max</div><div class="metric-val">${stats.max.toFixed(2)}</div></div>
              </div>
              <p class="section-label" style="margin-bottom:8px;">Pairwise distances</p>
              <div>
                ${pairs
                  .map((p) => {
                    const pct = (p.distance / maxD) * 100;
                    return `
                    <div class="pair-row">
                      <span style="color:var(--color-text-secondary);">${p.from} → ${p.to}</span>
                      <div style="display:flex; align-items:center; gap:8px;">
                        <div class="dist-bar-bg" style="width:80px;">
                          <div class="dist-bar-fill" style="width:${pct}%; background:#1D9E75;"></div>
                        </div>
                        <span style="font-size:12px; font-weight:500;">${p.distance.toFixed(2)}</span>
                      </div>
                    </div>`;
                  })
                  .join("")}
              </div>
            </div>`;
        }

        // ── speaker card ───────────────────────────────────────────────
        function renderSpeakerCard(speaker, isFullWidth = false) {
          const total = speaker.segments.length;
          const core = speaker.coreCount;
          const outlier = total - core;
          const purityPct = total > 0 ? Math.round((core / total) * 100) : 100;

          // purity bar — only show when there's a meaningful mix
          const purityHtml =
            total > 0
              ? `
            <div class="purity-row">
              <span class="purity-label">Centroid purity</span>
              <div class="purity-bar-bg">
                <div class="purity-bar-fill" style="width:${purityPct}%;"></div>
              </div>
              <span class="purity-count">${core} core · ${outlier} outlier</span>
            </div>`
              : "";

          const maxSegVal = Math.max(...speaker.segments.map((s) => s.d), 0.8);
          const segmentsHtml = speaker.segments
            .map((s) => {
              const widthPct = (s.d / maxSegVal) * 100;
              const pillClass = s.isCore ? "core" : "outlier";
              const pillLabel = s.isCore ? "core" : "outlier";
              return `
              <div class="seg-row">
                <span
                  class="seg-id"
                  onclick="event.stopPropagation(); window._speakerMetrics.openSegmentDetail('${s.id}')"
                  title="Open segment details"
                >${s.id}</span>
                <span class="seg-duration">${formatDuration(s.duration)}</span>
                <div class="dist-bar-bg" style="flex:1;">
                  <div class="dist-bar-fill" style="width:${widthPct.toFixed(1)}%; background:${barColor(s.d)};"></div>
                </div>
                <span class="seg-val">${s.d.toFixed(2)}</span>
                <span class="seg-core-pill ${pillClass}">
                  <span class="dot"></span>${pillLabel}
                </span>
              </div>`;
            })
            .join("");

          return `
            <div class="speaker-card" style="${isFullWidth ? "grid-column:1/-1;" : ""}">
              <div class="speaker-header">
                <div class="avatar" style="background:${speaker.bg}; color:${speaker.color};">${speaker.id}</div>
                <div>
                  <div class="speaker-name">${speaker.label}</div>
                  <div class="speaker-meta">${speaker.segmentsCount} segments</div>
                </div>
                <span class="badge ${badgeClass(speaker.health)}" style="margin-left:auto;">${speaker.health}</span>
              </div>
              <div class="grid-4" style="margin-bottom:12px;">
                <div class="metric-card"><div class="metric-lbl">Mean dist</div><div class="metric-val" style="font-size:17px;">${speaker.meanDist.toFixed(2)}</div></div>
                <div class="metric-card"><div class="metric-lbl">Std dev</div><div class="metric-val" style="font-size:17px;">${speaker.stdDev.toFixed(2)}</div></div>
                <div class="metric-card"><div class="metric-lbl">Min</div><div class="metric-val" style="font-size:17px;">${speaker.minDist.toFixed(2)}</div></div>
                <div class="metric-card"><div class="metric-lbl">Max</div><div class="metric-val" style="font-size:17px;">${speaker.maxDist.toFixed(2)}</div></div>
              </div>
              ${purityHtml}
              <p class="section-label" style="margin-bottom:6px;">Segment distances</p>
              <div>${segmentsHtml}</div>
            </div>`;
        }

        function renderSpeakersGrid(speakers) {
          if (speakers.length === 0) {
            return `<div style="padding:2rem; text-align:center; color:var(--color-text-secondary);">
              No speakers yet. Process some audio segments first.</div>`;
          }
          const firstTwo = speakers.slice(0, 2);
          const rest = speakers.slice(2);
          let html = '<div class="grid-2">';
          firstTwo.forEach((s) => {
            html += renderSpeakerCard(s, false);
          });
          rest.forEach((s) => {
            html += renderSpeakerCard(s, true);
          });
          html += "</div>";
          return html;
        }

        // ── main render ────────────────────────────────────────────────
        async function renderDashboard() {
          const root = document.getElementById("dashboard-root");
          root.innerHTML = `
            <div style="padding:3rem; text-align:center; color:var(--color-text-secondary);">
              <div style="font-size:18px; margin-bottom:8px;">Loading speaker metrics…</div>
              <div style="font-size:13px;">Fetching data from server</div>
            </div>`;

          const apiData = await fetchMetricsData();
          if (!apiData) {
            root.innerHTML = `
              <div style="padding:3rem; text-align:center;">
                <div style="font-size:18px; margin-bottom:8px; color:var(--color-text-primary);">Unable to load metrics</div>
                <div style="font-size:13px; color:var(--color-text-secondary);">
                  The speaker labeler may not be initialized. Process some audio segments first.
                </div>
                <button onclick="location.reload()" style="margin-top:1rem;">Retry</button>
              </div>`;
            return;
          }

          const { speakers, pairs, stats, overallHealth } =
            transformSpeakerData(apiData);

          root.innerHTML = `
            <h2 class="sr-only">Speaker diarization metrics dashboard</h2>
            <div style="padding:1rem 0;">
              <div class="flex-between">
                <div>
                  <div style="font-size:18px; font-weight:500; color:var(--color-text-primary);">Speaker metrics</div>
                  <div style="font-size:13px; color:var(--color-text-secondary); margin-top:2px;">
                    ${speakers.length} speakers · ${pairs.length} separation pairs
                    <span style="margin-left:8px; font-size:11px; color:var(--color-text-tertiary);">
                      (updated: ${apiData.timestamp ? new Date(apiData.timestamp).toLocaleTimeString() : "unknown"})
                    </span>
                  </div>
                </div>
                <button id="refreshBtn">Refresh ↻</button>
              </div>
              <p class="section-label">Inter-speaker separation</p>
              ${
                pairs.length > 0
                  ? renderSeparationCard(pairs, stats, overallHealth)
                  : `<div class="metric-card" style="text-align:center; padding:2rem; color:var(--color-text-secondary); margin-bottom:1.5rem;">
                    Need at least 2 speakers for separation metrics</div>`
              }
              <p class="section-label">Intra-speaker variance</p>
              ${renderSpeakersGrid(speakers)}
            </div>`;

          document
            .getElementById("refreshBtn")
            ?.addEventListener("click", renderDashboard);
          console.log("[SpeakerMetrics] Dashboard rendered");
        }

        window._speakerMetrics = { openSegmentDetail };
        renderDashboard();
      })();
    </script>
  </body>
</html>
