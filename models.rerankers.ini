# C:\Users\druiv\Desktop\Jet_Files\Jet_Windows_Workspace\models.rerankers.ini

# Launch command examples:
# llama-server --models-preset models.rerankers.ini --models-max 1 --host 0.0.0.0 --port 8082

version = 1

[*]  # Global defaults - tuned for Ryzen 5 3600 + GTX 1660 6GB
c = 2048              # Reduced from 8192
ngl = 35
threads = 6
threads-batch = 6
cache-type-k = q8_0
cache-type-v = q8_0
flash-attn = on
mlock = true
no-mmap = true
cont-batching = true
parallel = 1          # NEW: Reranking is memory intensive, do one at a time

# ====================== Rerankers ======================
[bge-rerank-v2-m3]
# BAAI/bge-reranker-v2-m3
model = C:\Users\druiv\.cache\llama.cpp\rerankers\bge-reranker-v2-m3-Q4_K_M.gguf
c = 1024
ngl = 999
alias = bge-rerank:v2-m3
rerank = true
pooling = rank
batch-size = 64       # Reduced from 1024
ubatch-size = 64      # Reduced from 1024
jinja = false
load-on-startup = true

[bge-rerank-large]
# BAAI/bge-reranker-large
model = C:\Users\druiv\.cache\llama.cpp\rerankers\bge-reranker-large-q4_k_m.gguf
c = 512
ngl = 999
alias = bge-rerank:large
rerank = true
pooling = rank
batch-size = 32       # Reduced from 512
ubatch-size = 32      # Reduced from 512
jinja = false

[qwen3-rerank-4b]
# Qwen/Qwen3-Reranker-4B
model = C:\Users\druiv\.cache\llama.cpp\rerankers\Qwen3-Reranker-4B-Q4_K_M.gguf
c = 2048              # Reduced from 4096
ngl = 999
alias = qwen3-rerank:4b
rerank = true
embedding = true
pooling = rank
batch-size = 16       # Reduced from 2048 (4B model is heavy)
ubatch-size = 16      # Reduced from 2048
jinja = false

[qwen3-rerank-0.6b]
# Qwen/Qwen3-Reranker-0.6B
model = C:\Users\druiv\.cache\llama.cpp\rerankers\Qwen3-Reranker-0.6B-q4_k_m.gguf
c = 2048
ngl = 999
alias = qwen3-rerank:0.6b
rerank = true
embedding = true
pooling = rank
batch-size = 64       # Reduced from 2048
ubatch-size = 64      # Reduced from 2048
jinja = false