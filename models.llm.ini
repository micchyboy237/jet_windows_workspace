# C:\Users\druiv\Desktop\Jet_Files\Jet_Windows_Workspace\models.llm.ini

# Launch command examples:
# llama-server --models-preset models.llm.ini --models-max 1 --host 0.0.0.0 --port 8080

version = 1

[*]  # Global defaults - tuned for Ryzen 5 3600 + GTX 1660 6GB
c = 4096              # Reduced from 8192 to save ~2GB VRAM on KV cache
ngl = 35
threads = 6
threads-batch = 6
cache-type-k = q8_0
cache-type-v = q8_0
flash-attn = on
mlock = true
no-mmap = true
cont-batching = true
temp = 0.75
min-p = 0.05
top-k = 40
top-p = 0.92
parallel = 1          # NEW: Prevent concurrent chat sessions to save VRAM

